<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little space to plan your week. Simple daily tasks, saved on your device.">
  <title>Weekbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23262626'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header class="brand"><span class="brand-mark" aria-hidden="true">✓</span><h1>Weekbox</h1></header>
    <section class="week-toolbar" aria-label="Week navigation">
      <div><p class="eyebrow">YOUR WEEK</p><h2 id="week-title" aria-live="polite"></h2></div>
      <nav aria-label="Choose week">
        <button id="previous" aria-label="Previous week" title="Previous week">←<span> Previous week</span></button>
        <button id="today">Today</button>
        <button id="next" aria-label="Next week" title="Next week"><span>Next week </span>→</button>
      </nav>
    </section>
    <div id="storage-message" role="status" hidden></div>
    <section id="week" aria-label="Daily tasks"></section>
  </main>
</body>
</html>
